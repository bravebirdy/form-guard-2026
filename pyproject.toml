[project]
name = "form-guard"
version = "0.1.0"
description = "IP + form_key rolling-window rate limiting service for form submissions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[tool.uvicorn]
factory = false

